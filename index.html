    <!-- Anti-flicker: aplica tamaño de fuente y zoom antes del primer render -->
    <script>
      (function () {
        try {
          var fs = localStorage.getItem('fisio-font-size');
          if (fs) {
            var fsVal = parseInt(fs, 10);
            if (fsVal === 14 || fsVal === 16 || fsVal === 18 || fsVal === 20) {
              document.documentElement.style.setProperty('--font-size-base', fsVal + 'px');
            }
          }
          var z = localStorage.getItem('fisio-zoom');
          if (z) {
            var zVal = parseInt(z, 10);
            if (zVal === 80 || zVal === 90 || zVal === 100 || zVal === 110 || zVal === 120) {
              document.documentElement.style.setProperty('--app-scale', zVal / 100);
            }
          }
        } catch (e) { /* localStorage no disponible */ }
      })();
    </script>
