<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Espejo AR - HUD Clínico (Escritorio)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #001514; /* Deep medical dark base for AR contrast */
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .success-glow {
            filter: drop-shadow(0 0 15px rgba(138, 211, 207, 0.8));
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .joint-line {
            stroke-dasharray: 5;
            animation: dash 20s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        .number-flow {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .skeleton-overlay {
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .bg-video-placeholder {
            filter: brightness(0.7) contrast(1.1);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#00504d",
                        "primary-container": "#156966",
                        "on-primary-container": "#9ce6e1",
                        "secondary": "#516161",
                        "tertiary": "#6e381d",
                        "tertiary-fixed": "#ffdbcc",
                        "surface": "#f9f9fc",
                        "outline": "#6f7978",
                        "navy-depth": "#001514",
                        "teal-neon": "#8ad3cf"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "md": "24px",
                        "lg": "40px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "headline": ["Montserrat", "sans-serif"],
                        "body": ["Montserrat", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen relative flex flex-col overflow-hidden">
<!-- AR Background Layer (Simulated Camera Feed) -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center bg-video-placeholder" data-alt="A focused physiotherapy patient performing a shoulder rehabilitation exercise in a brightly lit, high-end clinical gym. The background is slightly blurred with soft bokeh, featuring minimalist white medical equipment. The patient is seen from the front, centered for AR tracking. The overall aesthetic is professional, clean, and optimistic with high-key lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA7A6ARVP3HeekJt1z-VF7q0Xp2x_CRF8wtKPEX0wUFQSouYjOHqbifiFQ84t2PfPeZYxQT1fD8MkIdTqfMwT6tMe2iBi1miaCAa-_ZB1XdixtuJqKXoArC928JxOXbr17Vsdo_kgRdBJsDYEPMX6Go2ifsHI9Xs68SQs5U9lJ5LhlqwOGGFv8HyouV6EgBLJyLSuirq7Dmiv1MqukE2NfeApXnJAOB4ZGq2VauDZFGM2adweOEum7DIB019pUzEX2TM3taZO2AoomS')">
</div>
<!-- Shader Atmosphere Overlay -->

</div>
<!-- AR Skeleton Tracking Overlay (SVG) -->
<svg class="absolute inset-0 z-10 w-full h-full skeleton-overlay" viewbox="0 0 1920 1080">
<!-- Lines -->
<line class="joint-line opacity-70" stroke="#8ad3cf" stroke-width="4" x1="960" x2="800" y1="300" y2="450"></line>
<line class="joint-line opacity-70" stroke="#8ad3cf" stroke-width="4" x1="800" x2="700" y1="450" y2="700"></line>
<line class="joint-line opacity-70" stroke="#8ad3cf" stroke-width="4" x1="960" x2="1120" y1="300" y2="450"></line>
<line class="joint-line opacity-70" stroke="#8ad3cf" stroke-width="4" x1="1120" x2="1220" y1="450" y2="700"></line>
<!-- Joint Nodes -->
<circle class="success-glow" cx="960" cy="300" fill="#8ad3cf" r="10"></circle> <!-- Neck -->
<circle class="success-glow" cx="800" cy="450" fill="#8ad3cf" r="12"></circle> <!-- L-Shoulder -->
<circle class="success-glow" cx="1120" cy="450" fill="#8ad3cf" r="12"></circle> <!-- R-Shoulder -->
<circle class="opacity-50" cx="700" cy="700" fill="#8ad3cf" r="8"></circle> <!-- L-Elbow -->
<circle class="opacity-50" cx="1220" cy="700" fill="#8ad3cf" r="8"></circle> <!-- R-Elbow -->
</svg>
<!-- UI HUD Elements -->
<div class="relative z-20 flex flex-col h-full p-xl pointer-events-none">
<!-- Top HUD: Identity -->
<div class="flex justify-between items-start w-full">
<div class="glass-panel px-6 py-4 rounded-xl flex items-center gap-4 pointer-events-auto">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</div>
<div>
<h1 class="text-white font-bold text-lg leading-tight">Elevación Frontal</h1>
<p class="text-teal-neon/80 text-xs font-semibold tracking-widest uppercase">Sesión Terapéutica Activa</p>
</div>
</div>
<div class="glass-panel px-6 py-4 rounded-xl flex items-center gap-6 pointer-events-auto">
<div class="text-right">
<p class="text-white/60 text-xs uppercase font-bold tracking-tighter">Tiempo</p>
<p class="text-white font-mono text-xl" id="timer">04:12</p>
</div>
<div class="h-8 w-[1px] bg-white/20"></div>
<div class="text-right">
<p class="text-white/60 text-xs uppercase font-bold tracking-tighter">BPM</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-red-400 text-sm animate-pulse" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
<p class="text-white font-mono text-xl">82</p>
</div>
</div>
</div>
</div>
<!-- Middle HUD: Stats Grid -->
<div class="flex-grow flex items-center justify-between mt-12">
<!-- Left Stats: Reps & Sets -->
<div class="flex flex-col gap-6">
<div class="glass-panel p-8 rounded-2xl w-56 text-center pointer-events-auto transform transition-transform hover:scale-105">
<p class="text-teal-neon/60 text-xs font-bold uppercase tracking-[0.2em] mb-2">Series</p>
<div class="flex items-baseline justify-center gap-1">
<span class="text-white text-5xl font-black">2</span>
<span class="text-white/40 text-xl font-medium">/ 3</span>
</div>
</div>
<div class="glass-panel p-8 rounded-2xl w-56 text-center pointer-events-auto border-primary/40 transform transition-transform hover:scale-105">
<p class="text-teal-neon/60 text-xs font-bold uppercase tracking-[0.2em] mb-2">Repeticiones</p>
<div class="flex items-baseline justify-center gap-1" id="reps-container">
<span class="text-white text-7xl font-black number-flow" id="rep-counter">12</span>
</div>
</div>
</div>
<!-- Right Stats: Angle Meter -->
<div class="flex flex-col items-center">
<div class="glass-panel p-10 rounded-full relative w-64 h-64 flex flex-col items-center justify-center pointer-events-auto">
<!-- Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle cx="128" cy="128" fill="transparent" r="110" stroke="rgba(255,255,255,0.1)" stroke-width="8"></circle>
<circle class="transition-all duration-700 ease-out" cx="128" cy="128" fill="transparent" id="progress-circle" r="110" stroke="#8ad3cf" stroke-dasharray="691" stroke-dashoffset="345" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="z-10 text-center">
<p class="text-teal-neon/60 text-xs font-bold uppercase tracking-widest mb-1">Ángulo</p>
<h2 class="text-white text-5xl font-black leading-none">45°</h2>
<div class="h-[1px] w-12 bg-white/30 mx-auto my-3"></div>
<p class="text-white/60 text-sm font-medium">Objetivo: 90°</p>
</div>
<!-- Success Particle Anchor -->
<div class="absolute -top-4 -right-4">
<span class="material-symbols-outlined text-teal-neon text-3xl success-glow" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
</div>
</div>
<!-- Bottom HUD: AI Feedback & Controls -->
<div class="mt-auto w-full max-w-4xl mx-auto flex flex-col gap-6 items-center">
<!-- AI Guidance Message -->
<div class="glass-panel w-full py-6 px-10 rounded-3xl flex items-center gap-6 border-l-4 border-l-teal-neon pointer-events-auto shadow-2xl">
<div class="relative">
<span class="material-symbols-outlined text-teal-neon text-3xl animate-bounce" data-icon="smart_toy">smart_toy</span>
<div class="absolute -inset-2 bg-teal-neon/20 blur-xl rounded-full"></div>
</div>
<p class="text-white text-xl font-medium tracking-tight">
                    "Buen ritmo. <span class="text-teal-neon font-bold">Sube un poco más el codo</span> para completar el rango de movimiento."
                </p>
</div>
<!-- Control Bar -->
<div class="flex items-center gap-4 pointer-events-auto">
<button class="glass-panel px-8 py-4 rounded-2xl flex items-center gap-3 group hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="pause">pause</span>
<span class="text-white font-bold text-sm uppercase tracking-widest">Pausar</span>
</button>
<button class="bg-red-500/80 backdrop-blur-xl border border-red-400/50 px-8 py-4 rounded-2xl flex items-center gap-3 group hover:bg-red-500 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="stop">stop</span>
<span class="text-white font-bold text-sm uppercase tracking-widest">Finalizar</span>
</button>
<div class="h-8 w-[1px] bg-white/20 mx-2"></div>
<button class="glass-panel p-4 rounded-2xl hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="settings">settings</span>
</button>
<button class="glass-panel p-4 rounded-2xl hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="volume_up">volume_up</span>
</button>
</div>
</div>
</div>
<!-- Subtle Scanlines Overlay -->
<div class="absolute inset-0 z-30 pointer-events-none opacity-[0.03]" style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%;">
</div>
<script>
        // Micro-interactions and HUD Logic
        const repCounter = document.getElementById('rep-counter');
        const progressCircle = document.getElementById('progress-circle');
        let currentReps = 12;

        // Simulate Rep increase every few seconds
        setInterval(() => {
            currentReps++;
            if (currentReps > 15) currentReps = 0;
            
            repCounter.classList.add('scale-125', 'text-teal-neon');
            repCounter.innerText = currentReps;
            
            setTimeout(() => {
                repCounter.classList.remove('scale-125', 'text-teal-neon');
            }, 300);
        }, 8000);

        // Simulate Angle Progress Ring update
        let angleTarget = 90;
        let currentAngle = 45;
        
        function updateProgress() {
            // Full circle is 691 (2 * PI * 110)
            const circumference = 691;
            const offset = circumference - (currentAngle / angleTarget) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        updateProgress();

        // Simulate random angle changes for UI vitality
        setInterval(() => {
            currentAngle = 30 + Math.random() * 60;
            updateProgress();
            document.querySelector('h2.text-5xl').innerText = Math.round(currentAngle) + '°';
        }, 2000);

        // Timer Logic
        let seconds = 252; // 04:12
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body></html>
