<style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f9fc;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #00504d;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .active-recording {
            animation: haptic-pulse 0.4s ease-in-out infinite alternate;
        }

        @keyframes haptic-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .slide-up {
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .step-active {
            @apply bg-primary text-on-primary;
        }

        .step-inactive {
            @apply bg-surface-container-high text-on-surface-variant;
        }
    </style>
<style>
    body {

<body class="antialiased text-on-background min-h-screen flex flex-col items-center">

<!-- Main Content Canvas -->

<!-- Upload Bento Card -->

<span class="material-symbols-outlined text-4xl" id="mic-icon">mic</span>

</div>

</div>

<span>Procesar con IA</span>

<!-- Micro-interactions Script -->
<script>
        const recordBtn = document.getElementById('record-btn');
        const micIcon = document.getElementById('mic-icon');
        const ring = document.getElementById('ring');
        const statusText = document.getElementById('status-text');
        const recordingIndicator = document.getElementById('recording-indicator');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            
            if (isRecording) {
                micIcon.classList.add('hidden');
                recordingIndicator.classList.remove('hidden');
                ring.classList.add('animate-pulse-ring');
                recordBtn.classList.add('active-recording');
                recordBtn.classList.replace('bg-primary', 'bg-error');
                statusText.innerText = "Grabando... Toque para finalizar";
                statusText.classList.remove('opacity-60');
                statusText.classList.add('text-error', 'font-bold');
                
                // Add haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(50);
                }
            } else {
                micIcon.classList.remove('hidden');
                recordingIndicator.classList.add('hidden');
                ring.classList.remove('animate-pulse-ring');
                recordBtn.classList.remove('active-recording');
                recordBtn.classList.replace('bg-error', 'bg-primary');
                statusText.innerText = "Grabación pausada";
                statusText.classList.add('opacity-60');
                statusText.classList.remove('text-error', 'font-bold');
            }
        });
    </script>
