<script>
        // Micro-interactions and effects
        document.querySelectorAll('.glass-panel').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Search highlight effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('ring-2', 'ring-primary/20');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('ring-2', 'ring-primary/20');
        });

        // Simple category switching logic (visual only)
        const chips = document.querySelectorAll('.flex.gap-3 button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.className = "px-6 py-2 rounded-full font-label-sm text-label-sm glass-panel text-on-surface-variant hover:bg-white/60 transition-all active:scale-95";
                });
                chip.className = "px-6 py-2 rounded-full font-label-sm text-label-sm bg-primary text-on-primary shadow-lg shadow-primary/20 transition-transform active:scale-95";
            });
        });
    </script>
